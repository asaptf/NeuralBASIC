name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Gate the deploy on the suite. The lessons quote measured figures, so
      # publishing a commit whose tests fail means publishing prose that
      # contradicts the app — the one failure mode this project cannot ship.
      - name: Test
        run: npm test

      - name: Build static site
        run: npm run build
        env:
          # Project site URL: https://asaptf.github.io/NeuralBASIC/
          # Must match the GitHub Pages subpath for this repository.
          BASE_PATH: /NeuralBASIC

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
